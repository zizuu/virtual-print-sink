[package]
name = "virtual-print-sink"
version = "0.1.0"
edition = "2024"
description = "Cross-platform virtual print sink for LPR and IPP"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["clock"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.17"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[build-dependencies]
slint-build = "1.17"
